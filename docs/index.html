<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helal CRM — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Cairo, sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: #FAD028; }
    .card {
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 36px 32px 28px;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .mark {
      width: 34px; height: 34px; background: #FAD028;
      clip-path: polygon(18% 10%, 82% 50%, 18% 90%);
    }
    h1 { font-size: 28px; font-weight: 700; }
    .sub { color: #bdbdbd; margin: 4px 0 26px; font-size: 15px; }
    label { display: block; font-size: 13px; color: #cfcfcf; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font: 16px/1.4 Cairo, sans-serif;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #FAD028; }
    .row {
      display: flex; align-items: center; gap: 8px;
      margin: 2px 0 20px; color: #cfcfcf; font-size: 14px;
    }
    button[type="submit"] {
      width: 100%;
      background: #FAD028;
      color: #111;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font: 700 16px Cairo, sans-serif;
      cursor: pointer;
    }
    button[type="submit"]:hover { filter: brightness(0.96); }
    .error {
      display: none;
      background: #1c1c1c;
      color: #ff7a7a;
      border: 1px solid #8a1c1c;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <form class="card" id="login-form">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <h1>Helal CRM</h1>
    </div>
    <p class="sub">Sign in with your Helal account.</p>
    <div class="error" id="error">Wrong username or password.</div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <label class="row">
      <input id="remember" type="checkbox">
      Remember me on this device
    </label>
    <button type="submit">Sign in</button>
  </form>
  <script src="./auth.js"></script>
  <script>
    if (window.HelalAuth && HelalAuth.isLoggedIn()) {
      location.replace("./app.html");
    }
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var ok = await HelalAuth.signIn(
        document.getElementById("username").value,
        document.getElementById("password").value,
        document.getElementById("remember").checked
      );
      if (ok) location.replace("./app.html");
      else document.getElementById("error").style.display = "block";
    });
  </script>
</body>
</html>
